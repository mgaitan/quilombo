
services:
  - type: web
    plan: free
    name: quilombo
    runtime: python
    autoDeployTrigger: off
    buildCommand: "./build.sh"
    startCommand: "uv run --no-sync uvicorn quilombo.asgi:application --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # OAuth authorization state is persisted in PostgreSQL; keep one worker on the free tier
      # until we have measured the app under load and configured a production process manager.
      - key: WEB_CONCURRENCY
        value: 1
      - key: IS_PROD
        value: 1
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: PUBLIC_BASE_URL
        value: https://quilombo.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: https://quilombo.onrender.com,https://quilombo-v1-mgaitan.onrender.com
      - key: MCP_ALLOWED_HOSTS
        value: localhost:*,127.0.0.1:*,quilombo.onrender.com,quilombo-v1-mgaitan.onrender.com
      - key: MCP_ALLOWED_ORIGINS
        value: http://localhost:*,http://127.0.0.1:*,https://quilombo.onrender.com,https://quilombo-v1-mgaitan.onrender.com
