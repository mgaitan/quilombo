
services:
  - type: web
    plan: free
    name: quilombo-v1-mgaitan
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "uv run --no-sync uvicorn quilombo.asgi:application --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: IS_PROD
        value: 1
      - key: PUBLIC_BASE_URL
        value: https://quilombo-v1-mgaitan.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: https://quilombo-v1-mgaitan.onrender.com
      - key: MCP_ALLOWED_HOSTS
        value: localhost:*,127.0.0.1:*,quilombo-v1-mgaitan.onrender.com
      - key: MCP_ALLOWED_ORIGINS
        value: http://localhost:*,http://127.0.0.1:*,https://quilombo-v1-mgaitan.onrender.com
