
services:
  - type: web
    plan: free
    name: quilombo-v1-mgaitan
    runtime: python
    autoDeployTrigger: off
    domains:
      - quilombo.life
    buildCommand: "./build.sh"
    startCommand: "uv run --no-sync uvicorn quilombo.asgi:application --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # OAuth authorization state is persisted in PostgreSQL; keep one worker on the free tier
      # until we have measured the app under load and configured a production process manager.
      - key: WEB_CONCURRENCY
        value: 1
      - key: IS_PROD
        value: 1
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: PUBLIC_BASE_URL
        value: https://quilombo.life
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: https://quilombo.life,https://www.quilombo.life,https://quilombo-v1-mgaitan.onrender.com
      - key: MCP_ALLOWED_HOSTS
        value: localhost:*,127.0.0.1:*,quilombo.life,www.quilombo.life,quilombo-v1-mgaitan.onrender.com
      - key: MCP_ALLOWED_ORIGINS
        value: http://localhost:*,http://127.0.0.1:*,https://quilombo.life,https://www.quilombo.life,https://quilombo-v1-mgaitan.onrender.com

  # Persistent staging. Deploys whatever is on the `staging` branch
  # (`git push origin <ref>:staging -f`) against its own Neon branch. No OAuth or
  # mail provider: sign in with the seeded username/password. Not for real data.
  - type: web
    plan: free
    name: quilombo-staging
    runtime: python
    branch: staging
    autoDeployTrigger: commit
    buildCommand: "./build.sh"
    startCommand: "uv run --no-sync uvicorn quilombo.asgi:application --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1
      - key: APP_ENV
        value: staging
      - key: PYTHON_VERSION
        value: 3.14.3
      # Host, PUBLIC_BASE_URL, CSRF and MCP origins are derived from
      # RENDER_EXTERNAL_HOSTNAME, which Render injects automatically.
      - key: DATABASE_URL
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: staging
