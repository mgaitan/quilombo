<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta | Quilombo</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; color: #17212b; }
      main { width: min(28rem, calc(100% - 2rem)); background: white; border: 1px solid #d8dee4; padding: 2rem; }
      h1 { margin: 0 0 1.5rem; font-size: 1.5rem; }
      label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #9aa5b1; }
      button { width: 100%; margin-top: 1.5rem; padding: .75rem; border: 0; background: #176b55; color: white; font-weight: 700; cursor: pointer; }
      a { color: #075b9b; }
      .helptext { display: block; color: #52606d; font-size: .85rem; margin-top: .3rem; }
      .errorlist { color: #a21c2d; padding-left: 1.25rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Crear cuenta</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Continuar</button>
      </form>
      <p><a href="{% url 'login' %}">Ya tengo cuenta</a></p>
    </main>
  </body>
</html>
