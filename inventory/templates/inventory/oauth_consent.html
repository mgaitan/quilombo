{% extends "base.html" %}

{% block title %}Autorizar acceso | Quilombo{% endblock %}
{% block page_class %}auth-page{% endblock %}

{% block content %}
  <section class="auth-panel">
    <h1>Autorizar {{ client_name }}</h1>
    <p class="lede">Podrá buscar y actualizar el inventario del workspace que elijas.</p>
    <form method="post" class="stacked-form">
      {% csrf_token %}
      <input type="hidden" name="request" value="{{ authorization_request.id }}">
      <div class="field">
        <label for="workspace">Workspace</label>
        <select id="workspace" name="workspace" required>
          {% for workspace in workspaces %}
            <option value="{{ workspace.id }}">{{ workspace.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="actions">
        <button class="button button-primary" type="submit" name="action" value="allow">Autorizar</button>
        <button class="button" type="submit" name="action" value="deny">Cancelar</button>
      </div>
    </form>
  </section>
{% endblock %}
