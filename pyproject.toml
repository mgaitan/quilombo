[project]
name = "quilombo"
version = "0.1.0"
description = "Agent-first storage for physical inventories"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dj-database-url>=3.0,<4",
    "django>=6.0.8,<6.1",
    "djangorestframework>=3.16,<3.17",
    "drf-spectacular>=0.28,<0.29",
    "mcp>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.35,<0.36",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<0.13",
]
docs = [
    "myst-parser>=5.1",
    "sphinx>=8.2",
    "sphinx-book-theme>=1.2",
    "sphinxcontrib-mermaid>=2.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "quilombo.settings"
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
exclude = ["inventory/migrations"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
